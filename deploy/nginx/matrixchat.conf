# Serve behind an HTTPS reverse proxy. Do not expose this port directly.
map $uri $matrixchat_cache {
    default "no-cache";
    ~*\.html$ "no-store";
    / "no-store";
    /auth.js "no-store";
    /config.json "no-store";
    /flutter_bootstrap.js "no-store";
    /flutter_service_worker.js "no-store";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), display-capture=(self), usb=(), payment=()" always;
    add_header Cache-Control $matrixchat_cache always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    # Test WASM, SSO, RTC, homeserver delegation and fonts before enforcing.
    # No reporting endpoint: violations remain visible in browser diagnostics.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; media-src 'self' blob: data: https:; worker-src 'self' blob:; frame-src 'self' https:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

    location ~* \.map$ { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(js|wasm|json|css|png|jpg|jpeg|svg|ico|woff2?|ttf|bin)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
