name: MatrixChat Security Checks
on:
  push:
    branches: [security-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrixchat-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Validate web preparation shell syntax
        run: sh -n scripts/prepare-web.sh
      - run: flutter pub get --enforce-lockfile
      - name: Check formatting (report diff)
        run: |
          dart format lib/ test/
          git diff -- lib/ test/
          git diff --exit-code -- lib/ test/
      - name: Static analysis
        if: ${{ !cancelled() }}
        run: flutter analyze
      - name: Security unit tests
        if: ${{ !cancelled() }}
        run: flutter test test/utils/security_policy_test.dart test/utils/network_guard_test.dart test/utils/pin_attempt_guard_test.dart test/utils/media_vault_test.dart test/utils/rtc_security_test.dart test/utils/identity_pin_test.dart
