name: MatrixChat Security Checks
on:
  push:
    branches: [security-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrixchat-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Validate web preparation shell syntax
        run: sh -n scripts/prepare-web.sh
      - name: Check hardened web sources
        run: python3 scripts/validate_web_security.py
      - run: flutter pub get --enforce-lockfile
      - name: Check formatting (report diff)
        run: |
          dart format lib/ test/
          git diff -- lib/ test/
          git diff --exit-code -- lib/ test/
      - name: Static analysis
        if: ${{ !cancelled() }}
        run: flutter analyze
      - name: Security unit tests
        if: ${{ !cancelled() }}
        run: flutter test test/utils/security_policy_test.dart test/utils/network_guard_test.dart test/utils/pin_attempt_guard_test.dart test/utils/media_vault_test.dart test/utils/rtc_security_test.dart test/utils/identity_pin_test.dart test/utils/draft_vault_test.dart test/utils/sqlcipher_vault_test.dart

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch pinned OSV-Scanner
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64 -o "$RUNNER_TEMP/osv-scanner"
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod 700 "$RUNNER_TEMP/osv-scanner"
      - name: Scan supported lockfiles for known vulnerabilities
        run: '"$RUNNER_TEMP/osv-scanner" scan source -r .'

  dart-dependency-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version-file: .fvmrc
      - run: flutter pub get --enforce-lockfile
      - run: dart pub deps --json > dart-dependencies.json
      - run: python3 scripts/dart_sbom.py --self-test
      - run: python3 scripts/dart_sbom.py dart-dependencies.json matrixchat-dart.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dart-dependency-inventory
          path: |
            dart-dependencies.json
            matrixchat-dart.cdx.json
          retention-days: 7
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch pinned Gitleaks
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan checked-out sources without exposing secret values
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" dir --redact=100 --no-banner --exit-code 1 .'
