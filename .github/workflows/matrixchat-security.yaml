name: MatrixChat Security Checks
on:
  push:
    branches: [security-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrixchat-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Check formatting (report diff)
        run: |
          dart format lib/ test/
          git diff -- lib/ test/
          git diff --exit-code -- lib/ test/
      - name: Static analysis
        if: ${{ !cancelled() }}
        run: flutter analyze
      - name: Security unit tests
        if: ${{ !cancelled() }}
        run: flutter test test/utils/security_policy_test.dart test/utils/network_guard_test.dart test/utils/pin_attempt_guard_test.dart test/utils/media_vault_test.dart test/utils/rtc_security_test.dart test/utils/identity_pin_test.dart
