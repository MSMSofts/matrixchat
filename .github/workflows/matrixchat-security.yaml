name: MatrixChat Security Checks
on:
  push:
    branches: [security-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/utils/security_policy_test.dart test/utils/network_guard_test.dart
